# Serves the built dashboard and forwards the admin API and the relay endpoints to the server container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the service name at request time so that a recreated server container is found without a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://server:8080;

    # Request bodies may carry long prompts; matches the server's 16MB codec limit.
    client_max_body_size 16m;

    # Build assets carry a content hash in their name, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    location /admin/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streams must flow through untouched: no buffering, no cache, and a read timeout longer than the gateway's own.
    location /v1/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
